<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Register</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <div class="logo">
            <img src="images/logo.jpg" alt="StudentHub Logo">
            <h2>Student<span>Hub</span></h2>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="timetable.html">Timetable</a>
            <a href="assignment.html">Assignment</a>
            <a href="notice.html">Notice</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="auth-buttons">
            <a href="login.html" class="btn-text">Login</a>
            <a href="register.html" class="btn-primary-sm">Register</a>
        </div>

    </header>


    <!-- REGISTER -->
    <main class="auth-page">

        <div class="auth-card">

            <h1>Student Registration</h1>

            <p>Create your StudentHub account.</p>

            <form>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control"
                        placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control"
                        placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Mobile</label>
                    <input type="tel" class="form-control"
                        placeholder="Enter your mobile number">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control"
                        placeholder="Create a password">
                </div>

                <button type="submit" class="btn btn-blue">
                    Register
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <h3>StudentHub</h3>
        <p>Your Digital Campus Portal</p>
        <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
    </footer>

</body>

</html>
