<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">StudentHub Practical 8 Entity Relationship Diagram</title>
  <desc id="desc">The courses table has a one-to-many relationship with students. Students and events each have a one-to-many relationship with registrations, which resolves their many-to-many relationship.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18324b" flood-opacity=".09"/>
    </filter>
    <style>
      .heading{font:700 30px Inter,Arial,sans-serif;fill:#152b45}.subheading{font:15px Inter,Arial,sans-serif;fill:#60738b}
      .card{fill:#fff;stroke:#d7e2ef;stroke-width:1.5}.bar{fill:#1e4f91}.bar-courses{fill:#137c72}.bar-events{fill:#8a4db3}.bar-reg{fill:#d76b32}
      .table-title{font:700 20px Inter,Arial,sans-serif;fill:#fff}.field{font:15px Inter,Arial,sans-serif;fill:#31445b}.muted{font:13px Inter,Arial,sans-serif;fill:#657891}
      .badge-pk{fill:#e8f1ff}.badge-fk{fill:#e8f8f5}.badge-unique{fill:#f1eafd}.badge-text{font:700 11px Inter,Arial,sans-serif}
      .rel{fill:none;stroke:#526d8b;stroke-width:2.5}.rel-label{font:700 12px Inter,Arial,sans-serif;fill:#415a76}.rel-pill{fill:#fff;stroke:#d5dfeb;stroke-width:1}
      .legend{font:13px Inter,Arial,sans-serif;fill:#465a72}.legend-title{font:700 13px Inter,Arial,sans-serif;fill:#213b59}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#526d8b"/>
    </marker>
  </defs>

  <rect width="1240" height="800" rx="24" fill="url(#page)"/>
  <text class="heading" x="52" y="62">StudentHub · Database ER model</text>
  <text class="subheading" x="54" y="91">Normalized tables, key fields, and relationship cardinality</text>

  <!-- Relationships are behind the table cards. -->
  <path class="rel" d="M365 248 H449" marker-end="url(#arrow)"/>
  <path class="rel" d="M700 390 C700 435 840 428 840 468" marker-end="url(#arrow)"/>
  <path class="rel" d="M410 592 H689" marker-end="url(#arrow)"/>

  <!-- Courses -->
  <g filter="url(#shadow)">
    <rect class="card" x="55" y="150" width="310" height="195" rx="16"/>
    <path class="bar-courses" d="M71 150 H349 Q365 150 365 166 V198 H55 V166 Q55 150 71 150 Z"/>
    <text class="table-title" x="78" y="181">courses</text>
    <rect class="badge-pk" x="77" y="215" width="30" height="20" rx="6"/><text class="badge-text" x="84" y="229" fill="#1e4f91">PK</text>
    <text class="field" x="119" y="230">id · SMALLINT</text>
    <rect class="badge-unique" x="77" y="249" width="55" height="20" rx="6"/><text class="badge-text" x="83" y="263" fill="#7043a0">UNIQUE</text>
    <text class="field" x="143" y="264">course_code</text>
    <rect class="badge-unique" x="77" y="283" width="55" height="20" rx="6"/><text class="badge-text" x="83" y="297" fill="#7043a0">UNIQUE</text>
    <text class="field" x="143" y="298">course_name</text>
  </g>

  <!-- Students -->
  <g filter="url(#shadow)">
    <rect class="card" x="455" y="130" width="390" height="260" rx="16"/>
    <path class="bar" d="M471 130 H829 Q845 130 845 146 V178 H455 V146 Q455 130 471 130 Z"/>
    <text class="table-title" x="478" y="161">students</text>
    <rect class="badge-pk" x="477" y="195" width="30" height="20" rx="6"/><text class="badge-text" x="484" y="209" fill="#1e4f91">PK</text>
    <text class="field" x="519" y="210">id · BIGINT</text>
    <rect class="badge-unique" x="477" y="227" width="55" height="20" rx="6"/><text class="badge-text" x="483" y="241" fill="#7043a0">UNIQUE</text>
    <text class="field" x="543" y="242">student_code</text>
    <rect class="badge-unique" x="477" y="259" width="55" height="20" rx="6"/><text class="badge-text" x="483" y="273" fill="#7043a0">UNIQUE</text>
    <text class="field" x="543" y="274">email</text>
    <text class="field" x="477" y="306">first_name · last_name · mobile</text>
    <rect class="badge-fk" x="477" y="321" width="30" height="20" rx="6"/><text class="badge-text" x="484" y="335" fill="#137c72">FK</text>
    <text class="field" x="519" y="336">course_id → courses.id</text>
    <text class="muted" x="477" y="365">year_of_study · created_at</text>
  </g>

  <!-- Events -->
  <g filter="url(#shadow)">
    <rect class="card" x="55" y="475" width="355" height="230" rx="16"/>
    <path class="bar-events" d="M71 475 H394 Q410 475 410 491 V523 H55 V491 Q55 475 71 475 Z"/>
    <text class="table-title" x="78" y="506">events</text>
    <rect class="badge-pk" x="77" y="540" width="30" height="20" rx="6"/><text class="badge-text" x="84" y="554" fill="#1e4f91">PK</text>
    <text class="field" x="119" y="555">id · BIGINT</text>
    <text class="field" x="77" y="591">title · description</text>
    <text class="field" x="77" y="621">venue · starts_at</text>
    <text class="field" x="77" y="651">capacity · created_at</text>
  </g>

  <!-- Registrations -->
  <g filter="url(#shadow)">
    <rect class="card" x="695" y="475" width="490" height="230" rx="16"/>
    <path class="bar-reg" d="M711 475 H1169 Q1185 475 1185 491 V523 H695 V491 Q695 475 711 475 Z"/>
    <text class="table-title" x="718" y="506">registrations</text>
    <rect class="badge-pk" x="717" y="540" width="30" height="20" rx="6"/><text class="badge-text" x="724" y="554" fill="#1e4f91">PK</text>
    <text class="field" x="759" y="555">id · BIGINT</text>
    <rect class="badge-fk" x="717" y="573" width="30" height="20" rx="6"/><text class="badge-text" x="724" y="587" fill="#137c72">FK</text>
    <text class="field" x="759" y="588">student_id → students.id</text>
    <rect class="badge-fk" x="717" y="606" width="30" height="20" rx="6"/><text class="badge-text" x="724" y="620" fill="#137c72">FK</text>
    <text class="field" x="759" y="621">event_id → events.id</text>
    <text class="muted" x="717" y="657">registered_at · status · unique(student_id, event_id)</text>
  </g>

  <!-- Cardinality markers -->
  <g>
    <rect class="rel-pill" x="363" y="220" width="42" height="22" rx="11"/><text class="rel-label" x="376" y="235">1</text>
    <rect class="rel-pill" x="414" y="220" width="48" height="22" rx="11"/><text class="rel-label" x="423" y="235">0..*</text>
    <rect class="rel-pill" x="681" y="408" width="48" height="22" rx="11"/><text class="rel-label" x="690" y="423">1</text>
    <rect class="rel-pill" x="810" y="432" width="52" height="22" rx="11"/><text class="rel-label" x="817" y="447">0..*</text>
    <rect class="rel-pill" x="408" y="564" width="42" height="22" rx="11"/><text class="rel-label" x="421" y="579">1</text>
    <rect class="rel-pill" x="657" y="564" width="52" height="22" rx="11"/><text class="rel-label" x="664" y="579">0..*</text>
  </g>

  <!-- Legend -->
  <g transform="translate(55 750)">
    <text class="legend-title" x="0" y="0">KEY</text>
    <rect class="badge-pk" x="47" y="-17" width="30" height="20" rx="6"/><text class="badge-text" x="54" y="-3" fill="#1e4f91">PK</text><text class="legend" x="84" y="0">Primary key</text>
    <rect class="badge-fk" x="190" y="-17" width="30" height="20" rx="6"/><text class="badge-text" x="197" y="-3" fill="#137c72">FK</text><text class="legend" x="227" y="0">Foreign key</text>
    <rect class="badge-unique" x="344" y="-17" width="55" height="20" rx="6"/><text class="badge-text" x="350" y="-3" fill="#7043a0">UNIQUE</text><text class="legend" x="406" y="0">Unique field</text>
    <text class="legend" x="570" y="0">1 → 0..* = one-to-many relationship</text>
  </g>
</svg>
