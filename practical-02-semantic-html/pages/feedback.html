<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="StudentHub share feedback page"><title>Share feedback | StudentHub</title><link rel="stylesheet" href="../../practical-03-responsive-css/style.css"><script src="../../practical-04-dom-interactivity/script.js" defer></script></head><body><header class="navbar"><a class="logo" href="index.html"><img src="../../assets/images/logo.jpg" alt="StudentHub home"><span>StudentHub</span></a><button class="hamburger" id="hamburger" type="button" aria-label="Open menu" aria-controls="navLinks" aria-expanded="false">☰</button><nav class="nav-links" id="navLinks" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="../../practical-06-fetch-json/pages/events.html">Events</a><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a><a href="contact.html">Contact</a><a href="feedback.html">Feedback</a><a href="../../practical-09-secure-registration/">Register</a></nav><button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle color theme">🌙</button></header><main id="main-content" class="data-page"><h1>Share feedback</h1><section><h2>Help us improve StudentHub</h2><p>This Practical 2 page demonstrates a labelled, accessible feedback form. Submissions are not transmitted or saved.</p><form id="feedbackForm"><div class="form-group"><label for="feedbackName">Your name</label><input class="form-control" id="feedbackName" name="name" autocomplete="name" required></div><div class="form-group"><label for="feedbackEmail">Email address</label><input class="form-control" id="feedbackEmail" name="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="feedbackMessage">Feedback</label><textarea class="form-control" id="feedbackMessage" name="message" rows="5" required></textarea></div><button class="btn btn-blue" type="button" id="feedbackPreview">Preview feedback</button><p id="feedbackStatus" role="status" aria-live="polite"></p></form></section></main><footer><p>StudentHub · Web Development Frameworks (ITUE203)</p></footer><script>document.querySelector("#feedbackPreview")?.addEventListener("click",()=>{const form=document.querySelector("#feedbackForm");const status=document.querySelector("#feedbackStatus");if(!form.reportValidity())return;status.textContent="Feedback form completed. This frontend demonstration does not send or save your response.";});</script></body></html>
