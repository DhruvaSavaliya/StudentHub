            <img src="../../assets/images/logo.jpg" alt="StudentHub Logo">

        </div>

        <button class="hamburger" id="hamburger" type="button" aria-label="Open menu" aria-controls="navLinks" aria-expanded="false">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>

        <div class="auth-buttons">
            <a href="login.html" class="btn-text">Login</a>
            <a href="register.html" class="btn-primary-sm">Register</a>
        </div>

    </header>


    <!-- REGISTER FORM -->
    <main class="auth-page">

        <div class="auth-card">

            <h1>Student Registration</h1>

            <p>Create your StudentHub account.</p>

            <form id="registerForm" novalidate aria-describedby="formMessage">
                <div class="form-group"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required aria-describedby="nameError" class="form-control" placeholder="Enter your name"><p id="nameError" class="field-error"></p></div>
                <div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="emailError" class="form-control" placeholder="name@example.edu"><p id="emailError" class="field-error"></p></div>
                <div class="form-group"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="numeric" required aria-describedby="mobileError" class="form-control" placeholder="10 digit mobile number"><p id="mobileError" class="field-error"></p></div>
                <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="passwordError passwordStrength" class="form-control" placeholder="At least 8 characters"><p id="passwordError" class="field-error"></p><p id="passwordStrength" class="form-hint" aria-live="polite"></p></div>
                <div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirmPasswordError" class="form-control" placeholder="Enter the same password again"><p id="confirmPasswordError" class="field-error"></p></div>
                <div class="form-group"><label for="course">Course</label><select id="course" name="course" class="form-control" required aria-describedby="courseError"><option value="">Select your course</option><option>Information Technology</option><option>Computer Engineering</option><option>Computer Science</option></select><p id="courseError" class="field-error"></p></div>
                <fieldset class="form-group"><legend>Gender</legend><div class="choice-row"><label><input type="radio" name="gender" value="Female" required> Female</label><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Other"> Other</label></div><p id="genderError" class="field-error"></p></fieldset>
                <div class="form-group"><label for="year">Year of study</label><select id="year" name="year" class="form-control" required aria-describedby="yearError"><option value="">Select your year</option><option value="1">First year</option><option value="2">Second year</option><option value="3">Third year</option><option value="4">Fourth year</option></select><p id="yearError" class="field-error"></p></div>
                <div class="terms-row"><input type="checkbox" id="terms" name="terms" required aria-describedby="termsError"><label for="terms">I accept the terms and conditions</label></div><p id="termsError" class="field-error"></p>
                <p id="formMessage" role="status" aria-live="polite"></p>
                <button type="submit" class="btn btn-blue">Create account</button>
            </form>


            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </main>


    <!-- FOOTER -->

        <h3>StudentHub</h3>
